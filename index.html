<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Anna City 2 — Étape 1</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#7bcaff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
#game{width:100%;height:100%;display:block;touch-action:none}
#badge{position:fixed;left:14px;top:14px;padding:10px 14px;border-radius:14px;background:#142a42e8;color:#fff;font-weight:900;z-index:10;box-shadow:0 7px 20px #0004}
#badge small{display:block;color:#cfe1ff;margin-top:3px}
#hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:8px 13px;border-radius:12px;background:#142a42e8;color:#fff;font-size:12px;font-weight:850;z-index:10;white-space:nowrap}
#speed{position:fixed;right:14px;top:14px;padding:10px 13px;border-radius:14px;background:#142a42e8;color:#fff;font-weight:900;z-index:10}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="badge">🌸 ANNA CITY 2<small>ÉTAPE 1 · MONDE + ANNA + DÉPLACEMENTS</small></div>
<div id="speed">🏃 Vitesse normale</div>
<div id="hint">👈 moitié gauche : marcher · 👉 moitié droite : regarder · ✌️ pincer : zoom</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(()=>{
const canvas=document.getElementById('game');
const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true});
const scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(.48,.79,1,1);
scene.ambientColor=new BABYLON.Color3(.45,.45,.45);

const light=new BABYLON.HemisphericLight('sun',new BABYLON.Vector3(.2,1,.1),scene);
light.intensity=1.15;

function mat(name,hex){
 const m=new BABYLON.StandardMaterial(name,scene);
 m.diffuseColor=BABYLON.Color3.FromHexString(hex);
 return m;
}
const M={
 grass:mat('grass','#55b846'), dirt:mat('dirt','#80502d'),
 skin:mat('skin','#e2aa84'), hair:mat('hair','#5a3828'),
 pink:mat('pink','#d94f93'), pink2:mat('pink2','#f17ab2'),
 denim:mat('denim','#315da8'), white:mat('white','#f5f2ee'),
 black:mat('black','#22252b'), shoe:mat('shoe','#f1f1f1')
};

// Pixel grass texture
const tex=new BABYLON.DynamicTexture('grassPixels',{width:128,height:128},scene,false);
const ctx=tex.getContext();
ctx.fillStyle='#58b947';ctx.fillRect(0,0,128,128);
const spots=['#449c39','#69c755','#388c32','#77d361'];
for(let i=0;i<520;i++){ctx.fillStyle=spots[i%spots.length];ctx.fillRect((i*17)%128,(i*43)%128,2+(i%4),2+(i%3))}
tex.update(false);tex.updateSamplingMode(BABYLON.Texture.NEAREST_NEAREST);
tex.uScale=80;tex.vScale=80;M.grass.diffuseTexture=tex;

// Flat empty world, deliberately lightweight
const dirt=BABYLON.MeshBuilder.CreateBox('earth',{width:180,height:2,depth:180},scene);
dirt.position.y=-1;dirt.material=M.dirt;
const grass=BABYLON.MeshBuilder.CreateBox('grass',{width:180,height:.18,depth:180},scene);
grass.position.y=.09;grass.material=M.grass;

// Avatar root. Feet sit exactly on grass top (y=.18)
const anna=new BABYLON.TransformNode('Anna',scene);
anna.position.set(0,.18,0);
const parts={};

function box(name,w,h,d,x,y,z,material,parent=anna){
 const b=BABYLON.MeshBuilder.CreateBox(name,{width:w,height:h,depth:d},scene);
 b.position.set(x,y,z);b.material=material;b.parent=parent;b.isPickable=false;parts[name]=b;return b;
}
function sphere(name,diam,x,y,z,material,parent=anna,scale=null){
 const s=BABYLON.MeshBuilder.CreateSphere(name,{diameter:diam,segments:16},scene);
 s.position.set(x,y,z);s.material=material;s.parent=parent;s.isPickable=false;
 if(scale)s.scaling.set(scale[0],scale[1],scale[2]);parts[name]=s;return s;
}

// More character-like proportions than the old block person
box('torso',.76,.86,.36,0,1.43,0,M.pink);
box('skirt',.84,.38,.43,0,.93,0,M.pink2);
box('legL',.22,.72,.25,-.20,.52,0,M.skin);
box('legR',.22,.72,.25,.20,.52,0,M.skin);
box('shoeL',.28,.16,.48,-.20,.10,.08,M.white);
box('shoeR',.28,.16,.48,.20,.10,.08,M.white);

box('armL',.19,.78,.22,-.48,1.40,0,M.skin);
box('armR',.19,.78,.22,.48,1.40,0,M.skin);

sphere('head',.72,0,2.22,0,M.skin,null,[.92,1.05,.90]);
box('hairTop',.69,.20,.68,0,2.52,-.02,M.hair);
box('hairBack',.66,.72,.18,0,2.18,-.31,M.hair);
box('hairL',.15,.64,.20,-.32,2.14,-.10,M.hair);
box('hairR',.15,.64,.20,.32,2.14,-.10,M.hair);

// face
sphere('eyeL',.075,-.13,2.27,.34,M.black);
sphere('eyeR',.075,.13,2.27,.34,M.black);
box('mouth',.14,.035,.025,0,2.08,.355,M.pink);

// small ponytail
sphere('pony',.34,.38,2.27,-.28,M.hair,null,[.8,1.25,.8]);

// Camera — always behind and above, never under ground
const camera=new BABYLON.FreeCamera('camera',new BABYLON.Vector3(0,3,-6),scene);
camera.minZ=.05;camera.fov=.80;
let yaw=0,pitch=.14,distance=6.0;
function updateCamera(){
 const cp=Math.cos(pitch),sp=Math.sin(pitch);
 camera.position.set(
   anna.position.x-Math.sin(yaw)*cp*distance,
   anna.position.y+1.7+sp*distance,
   anna.position.z-Math.cos(yaw)*cp*distance
 );
 camera.setTarget(anna.position.add(new BABYLON.Vector3(0,1.25,0)));
}
updateCamera();

// Touch controls
let move=null,look=null,pinch=null,mx=0,my=0;
canvas.addEventListener('touchstart',e=>{
 e.preventDefault();
 if(e.touches.length>=2){
   const a=e.touches[0],b=e.touches[1];
   pinch=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
 }
 for(const t of e.changedTouches){
   if(t.clientX<innerWidth*.5&&!move)move={id:t.identifier,x:t.clientX,y:t.clientY};
   else if(!look)look={id:t.identifier,x:t.clientX,y:t.clientY};
 }
},{passive:false});
canvas.addEventListener('touchmove',e=>{
 e.preventDefault();
 if(e.touches.length>=2){
   const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
   if(pinch)distance=Math.max(2.6,Math.min(9,distance*(pinch/d)));
   pinch=d;
 }
 for(const t of e.changedTouches){
   if(move&&t.identifier===move.id){
     mx=Math.max(-1,Math.min(1,(t.clientX-move.x)/80));
     my=Math.max(-1,Math.min(1,(t.clientY-move.y)/80));
   }
   if(look&&t.identifier===look.id){
     yaw-=(t.clientX-look.x)*.0042;
     pitch=Math.max(-.08,Math.min(.52,pitch+(t.clientY-look.y)*.003));
     look.x=t.clientX;look.y=t.clientY;
   }
 }
},{passive:false});
canvas.addEventListener('touchend',e=>{
 for(const t of e.changedTouches){
   if(move&&t.identifier===move.id){move=null;mx=0;my=0}
   if(look&&t.identifier===look.id)look=null;
 }
 if(e.touches.length<2)pinch=null;
},{passive:false});

// Desktop fallback for testing
const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let walkPhase=0;
scene.onBeforeRenderObservable.add(()=>{
 let sx=mx,sy=my;
 if(keys['a'])sx=-1;if(keys['d'])sx=1;if(keys['w'])sy=-1;if(keys['s'])sy=1;

 const forward=new BABYLON.Vector3(Math.sin(yaw),0,Math.cos(yaw));
 const right=new BABYLON.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 const moving=Math.abs(sx)+Math.abs(sy)>.02;

 // Comfortable speed: faster than the slow version, but controllable
 anna.position.addInPlace(forward.scale(-sy*.042));
 anna.position.addInPlace(right.scale(sx*.038));
 anna.position.y=.18;

 if(moving){
   anna.rotation.y=yaw+Math.PI;
   walkPhase+=.12;
   parts.armL.rotation.x=Math.sin(walkPhase)*.45;
   parts.armR.rotation.x=-Math.sin(walkPhase)*.45;
   parts.legL.rotation.x=-Math.sin(walkPhase)*.32;
   parts.legR.rotation.x=Math.sin(walkPhase)*.32;
 }else{
   parts.armL.rotation.x*=.7;parts.armR.rotation.x*=.7;
   parts.legL.rotation.x*=.7;parts.legR.rotation.x*=.7;
 }
 updateCamera();
});

engine.runRenderLoop(()=>scene.render());
addEventListener('resize',()=>engine.resize());
})();
</script>
</body>
</html>

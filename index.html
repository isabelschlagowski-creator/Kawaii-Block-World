<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Anna City V4</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui;background:#78c8ff;touch-action:none}canvas{width:100%;height:100%;display:block}.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:10px;left:10px;background:#172433e8;color:white;padding:9px 12px;border-radius:10px;font-weight:800}.btns{position:absolute;right:10px;top:10px;display:flex;gap:6px;pointer-events:auto}.b{border:0;border-radius:10px;background:#172433e8;color:white;width:42px;height:42px;font-size:20px}.joy{position:absolute;left:20px;bottom:85px;width:120px;height:120px;border:2px solid #fff8;border-radius:50%;background:#fff3;pointer-events:auto}.nub{position:absolute;left:39px;top:39px;width:42px;height:42px;background:#fffc;border-radius:50%}.actions{position:absolute;right:14px;bottom:85px;display:grid;gap:7px;pointer-events:auto}.a{width:80px;height:52px;border:0;border-radius:11px;font-weight:800}.panel{display:none;position:fixed;inset:5%;z-index:9;background:#f5f7fa;border-radius:18px;padding:16px;overflow:auto}.close{float:right;border:0;background:#263545;color:white;border-radius:8px;padding:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;clear:both}.item{min-height:75px;border:0;border-radius:10px;background:white;font-size:16px}.chat{display:none;position:fixed;right:10px;top:60px;width:min(380px,88vw);height:390px;background:#14202ded;color:white;z-index:10;border-radius:14px;padding:10px}.msgs{height:300px;overflow:auto}.chat input{width:78%;padding:9px;border-radius:8px;border:0}.chat button{padding:9px;border:0;border-radius:8px}</style></head><body><canvas id="c"></canvas><div class="ui"><div class="top">👧 Anna ♥ Talcado<br>🌍 Monde plat continu · 👥 Ville vivante</div><div class="btns"><button class="b" id="bagB">🎒</button><button class="b" id="chatB">💬</button></div><div class="joy" id="joy"><div class="nub" id="nub"></div></div><div class="actions"><button class="a" id="place">🧱 Poser</button><button class="a" id="breakB">⛏️ Casser</button><button class="a" id="jump">⬆️ Sauter</button></div></div><div class="panel" id="bag"><button class="close" id="bagX">Fermer</button><h2>Construction illimitée</h2><div class="grid" id="grid"></div></div><div class="chat" id="chat"><button class="close" id="chatX">✕</button><b>Chat</b><div class="msgs" id="msgs"></div><input id="inp" placeholder="Écrire..."><button id="send">➤</button></div><script src="https://cdn.babylonjs.com/babylon.js"></script><script>
const C=document.getElementById("c"),E=new BABYLON.Engine(C,true),S=new BABYLON.Scene(E);S.clearColor=new BABYLON.Color4(.48,.78,1,1);S.collisionsEnabled=true;S.gravity=new BABYLON.Vector3(0,-.55,0);const cam=new BABYLON.UniversalCamera("Anna",new BABYLON.Vector3(0,3,30),S);cam.applyGravity=true;cam.checkCollisions=true;cam.ellipsoid.set(.4,.9,.4);new BABYLON.HemisphericLight("sun",new BABYLON.Vector3(0,1,0),S).intensity=1.1;
function m(h,a=1){let q=new BABYLON.StandardMaterial(h,S);q.diffuseColor=BABYLON.Color3.FromHexString(h);q.alpha=a;return q}const M={g:m("#73b95a"),w:m("#f8f8f5"),p:m("#e25b9d"),v:m("#8a62da"),b:m("#4d82d8"),c:m("#40c9df"),k:m("#222831"),r:m("#d84b4b"),y:m("#edc84b"),glass:m("#8eddf0",.4),road:m("#353b42"),skin:m("#e2ae88"),hair:m("#543426"),green:m("#4f9c60")};
function box(n,x,y,z,sx,sy,sz,ma,col=true){let b=BABYLON.MeshBuilder.CreateBox(n,{size:1},S);b.position.set(x,y,z);b.scaling.set(sx,sy,sz);b.material=ma;b.checkCollisions=col;b.metadata={kind:n};return b}
const CH=60,chunks=new Map();function stream(){let X=Math.round(cam.position.x/CH),Z=Math.round(cam.position.z/CH);for(let x=X-3;x<=X+3;x++)for(let z=Z-3;z<=Z+3;z++){let k=x+","+z;if(!chunks.has(k))chunks.set(k,box("ground",x*CH,-.5,z*CH,CH,1,CH,M.g))}for(let [k,o] of [...chunks]){let [x,z]=k.split(",").map(Number);if(Math.abs(x-X)>4||Math.abs(z-Z)>4){o.dispose();chunks.delete(k)}}}stream();
function villa(){let z=-25;box("villa",0,.6,z,38,.3,30,M.w);for(let y of [3,8,13]){let wid=38-(y-3)*1.5,dep=30-(y-3);box("villa",-wid/2,y,z,1,5,dep,M.w);box("villa",wid/2,y,z,1,5,dep,M.w);box("villa",0,y,z-dep/2,wid,5,1,M.w);box("villa",-wid*.32,y,z+dep/2,wid*.36,5,1,M.w);box("villa",wid*.32,y,z+dep/2,wid*.36,5,1,M.w);box("glass",0,y,z+dep/2,9,4,.12,M.glass,false);box("roof",0,y+2.7,z,wid,.35,dep,M.w)}box("accent",-17,8,z+10,1.2,12,1.2,M.p);box("accent",17,8,z+10,1.2,12,1.2,M.v);box("pool",-7,1,z+5,10,.3,7,M.c,false);box("pool",7,6,z+3,11,.3,8,M.c,false)}villa();
box("road",0,.1,18,100,.2,5,M.road,false);

const P=[],names=["Talcado","Awariz","Yoananas","Inès","Léo","Camille","Noah","Mila","Lou","Hugo","Zoé","Adam","Nina","Tom","Sarah","Lucas","Chloé","Ethan","Manon","Jade","Emma","Lina","Maël","Lola","Arthur","Rose","Louis","Eva"];
function human(name,x,z,shirt){let root=new BABYLON.TransformNode(name,S);root.position.set(x,0,z);function p(px,py,pz,sx,sy,sz,ma){let o=box("npc",px,py,pz,sx,sy,sz,ma,false);o.parent=root;return o}p(0,1.6,0,.9,1.25,.5,shirt);p(0,2.6,0,.82,.82,.82,M.skin);p(0,2.93,0,.9,.3,.9,M.hair);p(-.18,2.65,.43,.1,.1,.04,M.k);p(.18,2.65,.43,.1,.1,.04,M.k);let la=p(-.6,1.6,0,.23,1.1,.25,M.skin),ra=p(.6,1.6,0,.23,1.1,.25,M.skin),ll=p(-.22,.7,0,.3,1.1,.35,M.k),rl=p(.22,.7,0,.3,1.1,.35,M.k);root.metadata={name,la,ra,ll,rl,t:new BABYLON.Vector3(x,0,z),phase:Math.random()*6,speed:.025+Math.random()*.02};P.push(root)}
for(let i=0;i<names.length;i++)human(names[i],-42+Math.random()*84,3+Math.random()*13,[M.p,M.v,M.b,M.c,M.r,M.y,M.green][i%7]);
function target(p){if(p.metadata.name==="Talcado"&&Math.random()<.5)p.metadata.t.set(cam.position.x+2,0,cam.position.z+2);else p.metadata.t.set(-45+Math.random()*90,0,3+Math.random()*15)}P.forEach(target);
const items=[["⬜","Blanc",M.w],["🩷","Rose",M.p],["💜","Violet",M.v],["🟦","Bleu",M.b],["🩵","Cyan",M.c],["🟩","Vert",M.green],["🚗","Voiture",M.r],["🛋️","Canapé",M.p]];let sel=items[0];items.forEach(i=>{let b=document.createElement("button");b.className="item";b.textContent=i[0]+" "+i[1];b.onclick=()=>{sel=i;bag.style.display="none"};grid.appendChild(b)});
function pick(){return S.pickWithRay(cam.getForwardRay(14),o=>o.isPickable!==false)}place.onclick=()=>{let p=pick();if(!p.hit)return;let q=p.pickedPoint.add((p.getNormal(true)||BABYLON.Axis.Y).scale(.6));if(sel[1]==="Voiture")car(Math.round(q.x),Math.round(q.z),sel[2]);else box("placed",Math.round(q.x),Math.max(.5,Math.round(q.y)),Math.round(q.z),1,1,1,sel[2])};breakB.onclick=()=>{let p=pick();if(p.hit&&["placed","car"].includes(p.pickedMesh.metadata?.kind))p.pickedMesh.dispose()};jump.onclick=()=>cam.cameraDirection.y+=.22;
bagB.onclick=()=>bag.style.display="block";bagX.onclick=()=>bag.style.display="none";chatB.onclick=()=>chat.style.display="block";chatX.onclick=()=>chat.style.display="none";function msg(n,t){msgs.innerHTML+=`<div><b>${n}:</b> ${t}</div>`;msgs.scrollTop=msgs.scrollHeight}send.onclick=()=>{let t=inp.value.trim();if(t){msg("Anna",t);inp.value="";setTimeout(()=>msg(["Talcado","Awariz","Yoananas"][Math.floor(Math.random()*3)],"Je viens te rejoindre !"),400)}};
let jx=0,jy=0;function jm(e){let t=e.touches[0],r=joy.getBoundingClientRect(),x=t.clientX-r.left-60,y=t.clientY-r.top-60,d=Math.hypot(x,y),mx=39;if(d>mx){x=x/d*mx;y=y/d*mx}jx=x/mx;jy=y/mx;nub.style.transform=`translate(${x}px,${y}px)`}joy.ontouchstart=jm;joy.ontouchmove=jm;joy.ontouchend=()=>{jx=jy=0;nub.style.transform=""};let lp;C.ontouchstart=e=>{let t=e.touches[e.touches.length-1];if(t.clientX>innerWidth*.35)lp={x:t.clientX,y:t.clientY}};C.ontouchmove=e=>{if(!lp)return;let t=e.touches[e.touches.length-1];cam.rotation.y+=(t.clientX-lp.x)*.004;cam.rotation.x+=(t.clientY-lp.y)*.004;lp={x:t.clientX,y:t.clientY}};C.ontouchend=()=>lp=null;
let last=performance.now();S.onBeforeRenderObservable.add(()=>{let now=performance.now(),dt=Math.min(35,now-last);last=now;stream();for(let p of P){let t=p.metadata.t,dx=t.x-p.position.x,dz=t.z-p.position.z,d=Math.hypot(dx,dz);if(d<1){target(p);continue}let s=p.metadata.speed*dt;p.position.x+=dx/d*s;p.position.z+=dz/d*s;p.rotation.y=Math.atan2(dx,dz);p.metadata.phase+=dt*.012;let a=Math.sin(p.metadata.phase)*.55;p.metadata.la.rotation.x=a;p.metadata.ra.rotation.x=-a;p.metadata.ll.rotation.x=-a;p.metadata.rl.rotation.x=a}let f=cam.getDirection(BABYLON.Axis.Z);f.y=0;f.normalize();let r=cam.getDirection(BABYLON.Axis.X);r.y=0;r.normalize();cam.cameraDirection.addInPlace(f.scale(-jy*.07));cam.cameraDirection.addInPlace(r.scale(jx*.07))});E.runRenderLoop(()=>S.render());onresize=()=>E.resize();msg("Talcado","Coucou Anna ❤️ Je peux maintenant marcher dans la ville.");msg("Awariz","Il y a plein de monde aujourd'hui !");msg("Yoananas","On va explorer ?");
</script></body></html>

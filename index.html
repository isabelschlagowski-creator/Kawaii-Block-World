<!doctype html><html lang="fr"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#74c8ff;font-family:system-ui;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none;color:#fff}.glass{background:#102238e9;border:1px solid #ffffff2b;border-radius:12px;box-shadow:0 6px 18px #0005}.profile{position:absolute;left:10px;top:10px;width:210px;padding:8px 10px;font-weight:900}.profile small{display:block;font-size:11px;color:#b9d6ff}.top{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px;pointer-events:auto}.tb{width:48px;height:48px;border:0;border-radius:10px;background:#163451e8;color:#fff;font-size:21px}.money{position:absolute;right:10px;top:10px;padding:8px 12px;font-weight:900}.mini{position:absolute;right:10px;top:75px;width:120px;height:82px;background:#527e45;border:2px solid #fff8;border-radius:10px}.mini:after{content:"▲";position:absolute;left:51px;top:28px;font-size:20px}.left{position:absolute;left:10px;top:105px;display:grid;gap:5px;pointer-events:auto}.mb{width:120px;height:39px;border:0;border-radius:8px;background:#15283ce8;color:#fff;text-align:left;padding:0 10px;font-weight:800}.right{position:absolute;right:10px;top:180px;display:grid;gap:6px;pointer-events:auto}.rb{width:55px;height:55px;border:0;border-radius:10px;background:#15283ce8;color:#fff;font-size:21px}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:29px;text-shadow:0 2px 4px #000}.hint{position:absolute;left:50%;bottom:91px;transform:translateX(-50%);background:#102238dd;padding:6px 10px;border-radius:9px;font-size:11px;font-weight:800;white-space:nowrap}.hotbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:5px;padding:7px;background:#101c2be8;border-radius:12px;pointer-events:auto}.slot{width:52px;height:52px;border:2px solid #ffffff40;border-radius:8px;background:#263a51;color:#fff;font-size:25px}.slot.sel{border-color:#ffd83d;transform:translateY(-4px)}
.modal{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(820px,94vw);max-height:82vh;overflow:auto;padding:14px;pointer-events:auto}.close{float:right;border:0;border-radius:8px;padding:7px 10px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tab{border:0;border-radius:9px;padding:9px;background:#30455e;color:white;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{min-height:90px;border:0;border-radius:10px;background:#f5f7fb;color:#152235;font-weight:800;padding:8px}.card b{display:block;font-size:28px}.chat{display:none;position:absolute;right:12px;bottom:80px;width:min(390px,88vw);height:430px;padding:11px;pointer-events:auto}.msgs{height:305px;overflow:auto}.msg{max-width:87%;padding:8px 10px;border-radius:12px;margin:6px 0;font-size:13px}.me{margin-left:auto;background:#5c7ef1}.npc{background:#35475d}.row{display:flex;gap:6px}.row input{flex:1;border:0;border-radius:9px;padding:10px;user-select:text}.row button{border:0;border-radius:9px;padding:0 13px;background:#c261e5;color:#fff}.bubble{position:absolute;background:white;color:#172433;border-radius:12px;padding:7px 10px;font-weight:800;font-size:12px;box-shadow:0 4px 12px #0004;pointer-events:none;max-width:180px;text-align:center}.nameTag{position:absolute;color:white;background:#172433cc;border-radius:8px;padding:3px 6px;font-size:10px;font-weight:900;pointer-events:none}
.avatarGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.avatarGrid button{height:70px;border:0;border-radius:10px;font-size:25px}
</style></head><body><canvas id="g"></canvas>
<div class="ui">
<div class="profile glass">👧 Anna ♥ Anna City<small>NIVEAU 28 · MODE CRÉATIF · XP 12 500</small></div>
<div class="top"><button class="tb" id="save">💾</button><button class="tb">🎁</button><button class="tb">👥</button><button class="tb" id="chatB">💬</button></div>
<div class="money glass">🪙 125 860<br>💎 3 250</div><div class="mini"></div>
<div class="left"><button class="mb" id="bagB">🎒 Objets</button><button class="mb" id="avatarB">👤 Avatar</button><button class="mb" id="catalogB">🏗️ Catalogue</button><button class="mb">🛋️ Meubles</button><button class="mb">🚗 Véhicules</button><button class="mb">⭐ Quêtes</button><button class="mb">🗺️ Carte</button></div>
<div class="right"><button class="rb" id="breakB">⛏️</button><button class="rb" id="placeB">🧱</button><button class="rb" id="jumpB">⬆️</button><button class="rb" id="carB">🚗</button></div>
<div class="cross">＋</div><div class="hint">👈 marcher · 👉 regarder · ✌️ pincer = zoom · 🏗️ modèles prêts à placer</div>
<div class="hotbar" id="hotbar"></div>
<div class="modal glass" id="bag"><button class="close" data-x="bag">✕</button><h2>🎒 Tous les objets</h2><div class="grid" id="bagGrid"></div></div>
<div class="modal glass" id="avatar"><button class="close" data-x="avatar">✕</button><h2>👤 Mon avatar</h2><p>Choisis ton style :</p><div class="avatarGrid" id="avatarGrid"></div></div>
<div class="modal glass" id="catalog"><button class="close" data-x="catalog">✕</button><h2>🏗️ Catalogue de construction</h2><div class="tabs" id="catTabs"></div><div class="grid" id="catGrid"></div></div>
<div class="chat glass" id="chat"><button class="close" id="chatX">✕</button><h3 id="chatTitle">💬 Chat du monde</h3><div class="msgs" id="msgs"></div><div class="row"><input id="inp" placeholder="Écris comme dans Roblox…"><button id="send">➤</button></div></div>
<div id="overlay"></div></div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(()=>{const C=document.getElementById('g'),E=new BABYLON.Engine(C,true),S=new BABYLON.Scene(E);S.clearColor=new BABYLON.Color4(.46,.78,1,1);S.collisionsEnabled=true;S.gravity=new BABYLON.Vector3(0,-.42,0);
const cam=new BABYLON.UniversalCamera('Anna',new BABYLON.Vector3(0,3,8),S);cam.applyGravity=true;cam.checkCollisions=true;cam.ellipsoid.set(.32,.82,.32);cam.fov=.9;
new BABYLON.HemisphericLight('sky',new BABYLON.Vector3(0,1,0),S).intensity=1;
function M(n,c,a=1){let m=new BABYLON.StandardMaterial(n,S);m.diffuseColor=BABYLON.Color3.FromHexString(c);m.alpha=a;return m}
const mats={grass:M('grass','#66b947'),dirt:M('dirt','#8b5a35'),stone:M('stone','#858b91'),white:M('white','#eeeae1'),glass:M('glass','#91ddec',.42),wood:M('wood','#ae7c4a'),dark:M('dark','#383d43'),leaf:M('leaf','#4d9a4d'),water:M('water','#35badd',.75),pink:M('pink','#df63a5'),purple:M('purple','#8054cc'),blue:M('blue','#487ce0'),cyan:M('cyan','#38bdd6'),green:M('green','#3eb66b'),yellow:M('yellow','#e1bb3e'),orange:M('orange','#df8435'),red:M('red','#ca4b42'),black:M('black','#222831'),skin:M('skin','#d9a47e')};
function box(n,x,y,z,sx,sy,sz,ma,kind='decor',col=true){let b=BABYLON.MeshBuilder.CreateBox(n,{size:1},S);b.position.set(x,y,z);b.scaling.set(sx,sy,sz);b.material=ma;b.checkCollisions=col;b.metadata={kind};return b}
const CH=18,chunks=new Map();function chunk(x,z){let k=x+','+z;if(chunks.has(k))return;let d=box('dirt',x*CH,-1,z*CH,CH,2,CH,mats.dirt,'ground');let g=box('grass',x*CH,.02,z*CH,CH,.12,CH,mats.grass,'ground');chunks.set(k,[d,g])}
function stream(){let X=Math.round(cam.position.x/CH),Z=Math.round(cam.position.z/CH);for(let x=X-4;x<=X+4;x++)for(let z=Z-4;z<=Z+4;z++)chunk(x,z);for(let[k,v]of[...chunks]){let[x,z]=k.split(',').map(Number);if(Math.abs(x-X)>5||Math.abs(z-Z)>5){v.forEach(m=>m.dispose());chunks.delete(k)}}}stream();
const pal=[['grass','🟩','Herbe'],['stone','🪨','Pierre'],['white','⬜','Béton blanc'],['glass','🪟','Verre'],['wood','🟫','Bois'],['dark','⬛','Béton'],['leaf','🌿','Feuille'],['water','🟦','Eau'],['pink','🩷','Rose'],['purple','💜','Violet'],['blue','🔵','Bleu'],['cyan','🩵','Cyan'],['green','💚','Vert'],['yellow','💛','Jaune'],['orange','🧡','Orange'],['red','❤️','Rouge']];
let sel='white',placed=[];
function addBlock(x,y,z,k,save=true){let b=box('block',x,y,z,1,1,1,mats[k]||mats.white,'placed');b.metadata.key=k;placed.push(b);if(save)saveWorld();return b}
function saveWorld(){try{localStorage.setItem('annaV2000',JSON.stringify(placed.filter(x=>!x.isDisposed()).map(b=>({x:b.position.x,y:b.position.y,z:b.position.z,k:b.metadata.key}))));}catch(e){}}
try{JSON.parse(localStorage.getItem('annaV2000')||'[]').forEach(o=>addBlock(o.x,o.y,o.z,o.k,false))}catch(e){}
const hb=document.getElementById('hotbar'),bg=document.getElementById('bagGrid');pal.slice(0,10).forEach((p,i)=>{let b=document.createElement('button');b.className='slot'+(i===2?' sel':'');b.textContent=p[1];b.onclick=()=>{sel=p[0];document.querySelectorAll('.slot').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};hb.appendChild(b)});pal.forEach(p=>{let b=document.createElement('button');b.className='card';b.innerHTML='<b>'+p[1]+'</b>'+p[2];b.onclick=()=>{sel=p[0];bag.style.display='none'};bg.appendChild(b)});
function pick(){return S.pickWithRay(cam.getForwardRay(10),m=>m.isPickable!==false)}function place(){let p=pick();if(!p.hit)return;let q=p.pickedPoint.add((p.getNormal(true)||BABYLON.Axis.Y).scale(.55));addBlock(Math.round(q.x),Math.max(.5,Math.round(q.y-.5)+.5),Math.round(q.z),sel)}
placeB.onclick=place;breakB.onclick=()=>{let p=pick();if(p.hit&&p.pickedMesh.metadata?.kind==='placed'){let m=p.pickedMesh;placed=placed.filter(x=>x!==m);m.dispose();saveWorld()}};jumpB.onclick=()=>cam.cameraDirection.y+=.18;save.onclick=saveWorld;
bagB.onclick=()=>bag.style.display='block';avatarB.onclick=()=>avatar.style.display='block';catalogB.onclick=()=>catalog.style.display='block';document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.x).style.display='none');
const av=[['👧','Classique'],['👩🏻','Brune'],['👩🏼','Blonde'],['🧑🏽','Sport'],['👸','Princesse'],['🥷','Ninja']];av.forEach(a=>{let b=document.createElement('button');b.innerHTML=a[0]+'<br><small>'+a[1]+'</small>';b.onclick=()=>avatar.style.display='none';avatarGrid.appendChild(b)});
const templates={
'🏠 Maisons':[['🏡','Maison moderne'],['🏘️','Maison familiale'],['🏠','Petite maison'],['🏖️','Villa plage']],
'🏪 Magasins':[['👗','Mode'],['🧸','Jouets'],['🎮','Gaming'],['🛒','Supermarché'],['🥐','Boulangerie'],['💎','Bijouterie'],['📚','Librairie'],['🏬','Grand magasin']],
'🍕 Restaurants':[['🍕','Pizzeria'],['🍔','Burger'],['🍣','Sushi'],['🍰','Café'],['🥗','Healthy'],['🍦','Glacier']],
'🌳 Parcs':[['🌷','Jardin'],['🛝','Aire de jeux'],['⛲','Parc fontaine'],['🌴','Parc tropical']],
'🏢 Immeubles':[['🏢','Résidence'],['🏙️','Tour'],['🏨','Hôtel'],['🏫','École']],
'🎡 Loisirs':[['🎡','Grande roue'],['🎠','Fête foraine'],['🎬','Cinéma'],['🏟️','Stade']]
};let cat=Object.keys(templates)[0];function renderCats(){catTabs.innerHTML='';Object.keys(templates).forEach(k=>{let b=document.createElement('button');b.className='tab';b.textContent=k;b.onclick=()=>{cat=k;renderModels()};catTabs.appendChild(b)});renderModels()}function renderModels(){catGrid.innerHTML='';templates[cat].forEach((m,i)=>{let b=document.createElement('button');b.className='card';b.innerHTML='<b>'+m[0]+'</b>'+m[1];b.onclick=()=>{buildTemplate(cat,i);catalog.style.display='none'};catGrid.appendChild(b)})}renderCats();
function buildTemplate(cat,i){let f=cam.getDirection(BABYLON.Axis.Z);f.y=0;f.normalize();let cx=Math.round(cam.position.x+f.x*9),cz=Math.round(cam.position.z+f.z*9);let w=cat.includes('Maisons')?7:cat.includes('Magasins')?9:cat.includes('Restaurants')?8:cat.includes('Immeubles')?8:6;let h=cat.includes('Immeubles')?10:cat.includes('Parcs')?1:5;let d=cat.includes('Parcs')?8:7;if(cat.includes('Parcs')){for(let x=-w/2;x<=w/2;x++)for(let z=-d/2;z<=d/2;z++)if(Math.random()<.18)addBlock(Math.round(cx+x),.5,Math.round(cz+z),'leaf',false)}else{for(let y=0;y<h;y++)for(let x=-Math.floor(w/2);x<=Math.floor(w/2);x++)for(let z=-Math.floor(d/2);z<=Math.floor(d/2);z++){let edge=Math.abs(x)===Math.floor(w/2)||Math.abs(z)===Math.floor(d/2);if(!edge)continue;if(z===Math.floor(d/2)&&x===0&&y<2)continue;let k=(y===2&&z===Math.floor(d/2)&&Math.abs(x)<3)?'glass':(i%2?'wood':'white');addBlock(cx+x,y+.5,cz+z,k,false)}}saveWorld()}
const people=[],names=['Talcado','Awariz','Yoananas','Johanna','Mila','Léo','Inès','Noah','Lou','Camille','Jade','Emma','Lina','Arthur','Rose','Hugo','Zoé','Adam','Nina','Tom','Sarah','Lucas','Chloé','Ethan','Manon','Eva','Maël','Lola'];
function human(name,x,z,i){let root=new BABYLON.TransformNode(name,S);root.position.set(x,0,z);let shirt=[mats.pink,mats.purple,mats.blue,mats.cyan,mats.green,mats.yellow,mats.red][i%7];let body=box('npc',0,1.6,0,.8,1.2,.5,shirt,'npc',false);body.parent=root;let head=box('npc',0,2.55,0,.75,.75,.75,mats.skin,'npc',false);head.parent=root;root.metadata={name,target:new BABYLON.Vector3(x,0,z),phase:Math.random()*6};people.push(root);return root}names.forEach((n,i)=>human(n,-25+Math.random()*50,-25+Math.random()*50,i));
const cars=[];function car(x,z,k){let r=new BABYLON.TransformNode('car',S);r.position.set(x,0,z);let b=box('car',0,.7,0,3.2,.8,1.5,mats[k],'car',false);b.parent=r;let g=box('car',0,1.25,0,1.8,.55,1.2,mats.glass,'car',false);g.parent=r;r.metadata={occupied:false};cars.push(r)}[['pink',-7],['blue',0],['purple',7],['yellow',14]].forEach(a=>car(a[1],12,a[0]));let driving=null;carB.onclick=()=>{if(driving){cam.parent=null;cam.position=driving.position.add(new BABYLON.Vector3(0,2,2));driving=null;return}let near=cars.find(c=>BABYLON.Vector3.Distance(c.position,cam.position)<5);if(near){driving=near;cam.parent=near;cam.position.set(0,2.2,-.2)}};
let mt=null,lt=null,pinch=null,mx=0,my=0;C.addEventListener('touchstart',e=>{if(e.target.closest&&e.target.closest('button,input,.modal,.chat,.hotbar,.left,.right,.top'))return;e.preventDefault();if(e.touches.length>=2){let a=e.touches[0],b=e.touches[1];pinch=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}for(let t of e.changedTouches){if(t.clientX<innerWidth*.5&&!mt)mt={id:t.identifier,x0:t.clientX,y0:t.clientY,x:t.clientX,y:t.clientY};else if(!lt)lt={id:t.identifier,x:t.clientX,y:t.clientY}}},{passive:false});C.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length>=2){let a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinch)cam.fov=Math.max(.45,Math.min(1.3,cam.fov*(pinch/d)));pinch=d}for(let t of e.changedTouches){if(mt&&t.identifier===mt.id){mx=Math.max(-1,Math.min(1,(t.clientX-mt.x0)/70));my=Math.max(-1,Math.min(1,(t.clientY-mt.y0)/70))}if(lt&&t.identifier===lt.id){cam.rotation.y+=(t.clientX-lt.x)*.0045;cam.rotation.x=Math.max(-1.2,Math.min(1.2,cam.rotation.x+(t.clientY-lt.y)*.003));lt.x=t.clientX;lt.y=t.clientY}}},{passive:false});C.addEventListener('touchend',e=>{for(let t of e.changedTouches){if(mt&&t.identifier===mt.id){mt=null;mx=my=0}if(lt&&t.identifier===lt.id)lt=null}if(e.touches.length<2)pinch=null},{passive:false});
const bubbleEls=new Map();function bubble(name,text,root){let d=document.createElement('div');d.className='bubble';d.textContent=text;overlay.appendChild(d);bubbleEls.set(name,{el:d,root,until:Date.now()+5000})}
function addMsg(n,t){let d=document.createElement('div');d.className='msg '+(n==='Anna'?'me':'npc');d.innerHTML='<b>'+n+'</b><br>'+t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}
async function wiki(q){try{let r=await fetch('https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(q)+'&format=json&origin=*'),j=await r.json(),title=j?.query?.search?.[0]?.title;if(!title)return null;let x=await(await fetch('https://fr.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title))).json();return x.extract?x.extract.split('. ').slice(0,2).join('. ')+'.':null}catch(e){return null}}
async function reply(q,n){let t=q.toLowerCase();if(/salut|coucou|bonjour/.test(t))return 'Coucou Anna 😊';if(/constru/.test(t))return 'Ouvre 🏗️ Catalogue ou construis bloc par bloc !';if(/voiture/.test(t))return 'Approche-toi d’une voiture puis touche 🚗.';let w=await wiki(q);return w||['Bonne question 😄','Je ne sais pas encore, mais on peut chercher !','Moi je construirais quelque chose ici 😎'][Math.floor(Math.random()*3)]}
chatB.onclick=()=>chat.style.display='block';chatX.onclick=()=>chat.style.display='none';send.onclick=async()=>{let q=inp.value.trim();if(!q)return;inp.value='';addMsg('Anna',q);bubble('Anna',q,null);let nearest=people.sort((a,b)=>BABYLON.Vector3.Distance(a.position,cam.position)-BABYLON.Vector3.Distance(b.position,cam.position))[0];let n=nearest?.metadata?.name||'Talcado',ans=await reply(q,n);addMsg(n,ans);bubble(n,ans,nearest)};inp.addEventListener('keydown',e=>{if(e.key==='Enter')send.click()});
S.onBeforeRenderObservable.add(()=>{stream();let f=cam.getDirection(BABYLON.Axis.Z);f.y=0;if(f.lengthSquared())f.normalize();let r=cam.getDirection(BABYLON.Axis.X);r.y=0;if(r.lengthSquared())r.normalize();if(driving){driving.rotation.y=cam.rotation.y;driving.position.addInPlace(f.scale(-my*.12));driving.position.addInPlace(r.scale(mx*.05))}else{cam.cameraDirection.addInPlace(f.scale(-my*.075));cam.cameraDirection.addInPlace(r.scale(mx*.068))}
people.forEach(p=>{if(Math.random()<.004)p.metadata.target.set(-28+Math.random()*56,0,-28+Math.random()*56);let dx=p.metadata.target.x-p.position.x,dz=p.metadata.target.z-p.position.z,d=Math.hypot(dx,dz);if(d>.5){p.position.x+=dx/d*.012;p.position.z+=dz/d*.012;p.rotation.y=Math.atan2(dx,dz)}});
for(let[k,o]of[...bubbleEls]){if(Date.now()>o.until){o.el.remove();bubbleEls.delete(k);continue}let pos;if(k==='Anna'){pos=cam.position.add(new BABYLON.Vector3(0,.6,0))}else if(o.root)pos=o.root.position.add(new BABYLON.Vector3(0,3.3,0));else continue;let v=BABYLON.Vector3.Project(pos,BABYLON.Matrix.Identity(),S.getTransformMatrix(),cam.viewport.toGlobal(E.getRenderWidth(),E.getRenderHeight()));o.el.style.left=(v.x-o.el.offsetWidth/2)+'px';o.el.style.top=(v.y-o.el.offsetHeight-10)+'px'}});
E.runRenderLoop(()=>S.render());onresize=()=>E.resize();addMsg('Talcado','Coucou Anna ❤️ Construis TA ville comme tu veux !');})();
</script></body></html>

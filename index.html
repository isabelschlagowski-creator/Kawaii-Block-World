<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MonTube Privé</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0f0f0f;color:#fff}
header{position:sticky;top:0;z-index:10;background:#0f0f0f;padding:12px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #333}
.logo{font-size:23px;font-weight:800;white-space:nowrap}
.logo b{background:#f00;padding:5px 9px;border-radius:9px}
#search{flex:1;background:#222;border:1px solid #555;border-radius:24px;padding:11px 15px;color:#fff;font-size:16px}
.create{background:#fff;border:0;border-radius:20px;padding:10px 14px;font-weight:700}
.notice{margin:12px 14px;padding:10px 12px;background:#1d1d1d;border-radius:12px;color:#bbb;font-size:13px}
.grid{padding:8px 14px 90px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{cursor:pointer}
.thumb{height:165px;border-radius:14px;background:#222;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:50px;position:relative}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;right:8px;bottom:8px;background:#000c;padding:4px 7px;border-radius:6px;font-size:12px}
h3{margin:9px 0 4px}.meta{color:#aaa;font-size:14px}
.player{display:none;padding:14px 14px 95px}
.back{border:0;border-radius:20px;padding:10px 15px;font-weight:bold}
video#mainVideo{width:100%;max-height:68vh;background:#000;border-radius:14px;margin-top:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.actions button{border:0;border-radius:20px;padding:10px 14px;font-weight:700}
.danger{background:#ff4d4d;color:#fff}
.empty{text-align:center;padding:70px 20px;color:#aaa}
.modal{display:none;position:fixed;inset:0;z-index:30;background:#000b;align-items:center;justify-content:center;padding:18px}
.box{width:min(520px,100%);background:#1b1b1b;border-radius:18px;padding:18px}
.box h2{margin-top:0}
.box input{width:100%;margin:8px 0 12px;background:#292929;border:1px solid #555;border-radius:12px;padding:12px;color:#fff;font-size:16px}
.box label{display:block;color:#ccc;margin-top:8px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.row button{border:0;border-radius:18px;padding:10px 14px;font-weight:700}
nav{position:fixed;bottom:0;width:100%;background:#181818;display:flex;justify-content:space-around;padding:11px 4px;border-top:1px solid #333;z-index:12}
nav span{text-align:center;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="logo"><b>▶</b> MonTube</div>
  <input id="search" placeholder="Rechercher mes vidéos" oninput="render()">
  <button class="create" onclick="openCreate()">➕ Créer</button>
</header>

<div class="notice">🔒 Mode privé : cette page ne publie rien sur Internet. Les vidéos restent sélectionnées depuis ton appareil et ne sont pas envoyées à un serveur.</div>

<section id="home">
  <main id="grid" class="grid"></main>
</section>

<section id="player" class="player">
  <button class="back" onclick="goHome()">← Retour</button>
  <video id="mainVideo" controls playsinline></video>
  <h2 id="ptitle"></h2>
  <div id="pmeta" class="meta"></div>
  <div class="actions">
    <button onclick="likeCurrent()">👍 <span id="likeCount">0</span></button>
    <button class="danger" onclick="deleteCurrent()">🗑 Supprimer</button>
  </div>
</section>

<div id="modal" class="modal">
  <div class="box">
    <h2>Créer une vidéo</h2>
    <label>Titre</label>
    <input id="titleInput" placeholder="Ex : Ma vidéo trop drôle">
    <label>Choisir une vidéo depuis ton iPad</label>
    <input id="videoInput" type="file" accept="video/*">
    <label>Miniature (facultatif)</label>
    <input id="thumbInput" type="file" accept="image/*">
    <div class="row">
      <button onclick="closeCreate()">Annuler</button>
      <button onclick="saveVideo()">Ajouter</button>
    </div>
  </div>
</div>

<nav>
  <span onclick="goHome()">🏠<br>Accueil</span>
  <span onclick="openCreate()">➕<br>Créer</span>
  <span onclick="alert('Toutes tes vidéos sont privées dans cette version 😊')">🔒<br>Privé</span>
  <span onclick="showCount()">👤<br>Mes vidéos</span>
</nav>

<script>
let videos = JSON.parse(localStorage.getItem('montube_meta') || '[]');
let currentId = null;

// Les vrais fichiers vidéo restent en mémoire tant que la page est ouverte.
// Les métadonnées (titres, likes) sont mémorisées localement.
const objectUrls = {};
const thumbUrls = {};

function persist(){
  localStorage.setItem('montube_meta', JSON.stringify(videos.map(v=>({
    id:v.id,title:v.title,likes:v.likes||0,created:v.created||Date.now()
  }))));
}

function render(){
  const q = document.getElementById('search').value.toLowerCase();
  const grid = document.getElementById('grid');
  const shown = videos.filter(v => (v.title||'').toLowerCase().includes(q));
  if(!shown.length){
    grid.innerHTML = '<div class="empty">🎬<br><br>Aucune vidéo ici pour le moment.<br>Appuie sur <b>➕ Créer</b> pour ajouter ta première vidéo.</div>';
    return;
  }
  grid.innerHTML = shown.map(v=>{
    const t = thumbUrls[v.id];
    return `<div class="card" onclick="openVideo('${v.id}')">
      <div class="thumb">${t ? `<img src="${t}">` : '🎥'}<span class="badge">Privée 🔒</span></div>
      <h3>${escapeHtml(v.title)}</h3>
      <div class="meta">Moi · ${v.likes||0} j’aime</div>
    </div>`;
  }).join('');
}

function openCreate(){
  document.getElementById('modal').style.display='flex';
}
function closeCreate(){
  document.getElementById('modal').style.display='none';
}
function saveVideo(){
  const title = document.getElementById('titleInput').value.trim();
  const vf = document.getElementById('videoInput').files[0];
  const tf = document.getElementById('thumbInput').files[0];
  if(!title || !vf){ alert('Ajoute un titre et choisis une vidéo 😊'); return; }
  const id = 'v'+Date.now();
  objectUrls[id] = URL.createObjectURL(vf);
  if(tf) thumbUrls[id] = URL.createObjectURL(tf);
  videos.unshift({id,title,likes:0,created:Date.now()});
  persist();
  document.getElementById('titleInput').value='';
  document.getElementById('videoInput').value='';
  document.getElementById('thumbInput').value='';
  closeCreate();
  render();
}
function openVideo(id){
  currentId=id;
  const v = videos.find(x=>x.id===id);
  if(!v) return;
  if(!objectUrls[id]){
    alert("Pour des raisons de sécurité de l’iPad, il faut re-sélectionner cette vidéo après avoir complètement fermé la page. Le titre reste sauvegardé.");
    return;
  }
  document.getElementById('home').style.display='none';
  document.getElementById('player').style.display='block';
  const mv=document.getElementById('mainVideo');
  mv.src=objectUrls[id];
  document.getElementById('ptitle').textContent=v.title;
  document.getElementById('pmeta').textContent='Moi · Vidéo privée 🔒';
  document.getElementById('likeCount').textContent=v.likes||0;
}
function goHome(){
  const mv=document.getElementById('mainVideo');
  mv.pause(); mv.removeAttribute('src'); mv.load();
  document.getElementById('player').style.display='none';
  document.getElementById('home').style.display='block';
  render();
}
function likeCurrent(){
  const v=videos.find(x=>x.id===currentId); if(!v) return;
  v.likes=(v.likes||0)+1; persist();
  document.getElementById('likeCount').textContent=v.likes;
}
function deleteCurrent(){
  if(!currentId) return;
  if(!confirm('Supprimer cette vidéo de MonTube ?')) return;
  videos=videos.filter(v=>v.id!==currentId);
  delete objectUrls[currentId]; delete thumbUrls[currentId];
  persist(); currentId=null; goHome();
}
function showCount(){
  alert(`Tu as ${videos.length} vidéo${videos.length>1?'s':''} dans MonTube.`);
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
render();
</script>
</body>
</html>

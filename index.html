<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Anna City V1000 REBUILD</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#7ac8ff;touch-action:none}
#game{width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none;color:white}
.panel{background:linear-gradient(180deg,#17283de8,#0e1a2be8);border:1px solid #ffffff2b;box-shadow:0 8px 24px #0005;border-radius:14px}
#profile{position:absolute;left:12px;top:12px;width:250px;padding:10px 12px;font-weight:800}
#profile .small{font-size:12px;opacity:.85}
#topbar{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;gap:7px;pointer-events:auto}
.topbtn{width:54px;height:54px;border:0;border-radius:12px;background:#18314ce8;color:white;font-size:22px;box-shadow:0 5px 15px #0004}
#currency{position:absolute;right:12px;top:12px;padding:8px 12px;font-weight:800;min-width:130px;text-align:right}
#leftmenu{position:absolute;left:12px;top:120px;display:grid;gap:6px;pointer-events:auto}
.menuBtn{width:118px;height:42px;border:0;border-radius:10px;background:#142235e8;color:white;text-align:left;padding:0 12px;font-weight:800}
#righttools{position:absolute;right:12px;top:120px;display:grid;gap:7px;pointer-events:auto}
.tool{width:58px;height:58px;border:0;border-radius:12px;background:#17283de8;color:white;font-size:21px}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:30px;text-shadow:0 2px 4px #000;pointer-events:none}
#hint{position:absolute;left:50%;bottom:98px;transform:translateX(-50%);padding:7px 11px;border-radius:10px;background:#142235dd;font-size:12px;font-weight:800;white-space:nowrap}
#hotbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;padding:8px;background:#101b29e6;border-radius:14px;pointer-events:auto;box-shadow:0 8px 24px #0005}
.slot{width:58px;height:58px;border:2px solid #ffffff44;border-radius:10px;background:#25384f;color:white;font-size:28px;display:grid;place-items:center}
.slot.sel{border-color:#ffd84a;transform:translateY(-5px);box-shadow:0 0 0 3px #ffd84a33}
#chat{display:none;position:absolute;right:14px;bottom:90px;width:min(390px,88vw);height:430px;padding:12px;pointer-events:auto}
#chatHeader{display:flex;justify-content:space-between;align-items:center;font-weight:900}
#msgs{height:315px;overflow:auto;margin:10px 0;padding-right:4px}
.msg{padding:9px 10px;border-radius:12px;margin:6px 0;max-width:88%;font-size:14px}
.me{margin-left:auto;background:#587df2}
.tal{background:#314257}
#chatRow{display:flex;gap:6px}
#chat input{flex:1;border:0;border-radius:10px;padding:11px;font-size:14px;user-select:text}
#chat button{border:0;border-radius:10px;padding:0 14px;font-size:20px;background:#c35fe6;color:white}
#inventory{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(740px,92vw);max-height:78vh;padding:16px;overflow:auto;pointer-events:auto}
#invGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.invItem{height:80px;border:0;border-radius:12px;background:#f5f7fb;color:#152235;font-weight:800;font-size:14px}
.invItem b{display:block;font-size:28px}
#mini{position:absolute;right:12px;top:82px;width:130px;height:90px;background:#274d37d9;border:2px solid #fff7;border-radius:12px;overflow:hidden}
#mini:before{content:"";position:absolute;inset:0;background:
linear-gradient(90deg,transparent 48%,#ffffff35 49%,#ffffff35 51%,transparent 52%),
linear-gradient(0deg,transparent 48%,#ffffff35 49%,#ffffff35 51%,transparent 52%)}
#miniDot{position:absolute;left:61px;top:40px;font-size:18px}
#toast{position:absolute;left:50%;top:78px;transform:translateX(-50%);padding:9px 13px;background:#15263be8;border-radius:10px;font-weight:800;opacity:0;transition:.2s}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="ui">
  <div id="profile" class="panel">👧 Anna ♥ Talcado<br><span class="small">NIVEAU 28 · MODE CRÉATIF · BLOCS ∞</span></div>

  <div id="topbar">
    <button class="topbtn" id="saveBtn">💾</button>
    <button class="topbtn" id="giftBtn">🎁</button>
    <button class="topbtn" id="chatBtn">💬</button>
  </div>

  <div id="currency" class="panel">🪙 125 860<br>💎 3 250</div>

  <div id="mini" class="panel"><div id="miniDot">▲</div></div>

  <div id="leftmenu">
    <button class="menuBtn" id="invBtn">🎒 Inventaire</button>
    <button class="menuBtn">🔨 Construire</button>
    <button class="menuBtn">🛋️ Meubles</button>
    <button class="menuBtn">🚗 Véhicules</button>
    <button class="menuBtn">⭐ Quêtes</button>
    <button class="menuBtn">🗺️ Carte</button>
  </div>

  <div id="righttools">
    <button class="tool" id="breakBtn">⛏️</button>
    <button class="tool" id="placeBtn">🧱</button>
    <button class="tool" id="jumpBtn">⬆️</button>
  </div>

  <div id="cross">＋</div>
  <div id="hint">👈 gauche : marcher · 👉 droite : regarder · ✌️ pincer : zoom</div>

  <div id="hotbar"></div>

  <div id="chat" class="panel">
    <div id="chatHeader"><span>🐱 Talcado · en ligne</span><button id="chatClose">✕</button></div>
    <div id="msgs"></div>
    <div id="chatRow"><input id="chatInput" placeholder="Pose une question à Talcado…"><button id="sendBtn">➤</button></div>
  </div>

  <div id="inventory" class="panel">
    <button id="invClose" style="float:right;border:0;border-radius:8px;padding:7px 10px">✕</button>
    <h2>🎒 Inventaire créatif — blocs illimités</h2>
    <div id="invGrid"></div>
  </div>

  <div id="toast"></div>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(()=> {
const canvas=document.getElementById('game');
const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true});
const scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(.47,.78,1,1);
scene.collisionsEnabled=true;
scene.gravity=new BABYLON.Vector3(0,-.36,0);

const camera=new BABYLON.UniversalCamera('Anna',new BABYLON.Vector3(0,3,10),scene);
camera.minZ=.08;
camera.fov=.9;
camera.applyGravity=true;
camera.checkCollisions=true;
camera.ellipsoid=new BABYLON.Vector3(.32,.82,.32);
camera.speed=.25;

new BABYLON.HemisphericLight('sky',new BABYLON.Vector3(0,1,0),scene).intensity=.95;
const sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-.5,-1,.4),scene);
sun.intensity=.65;

function mat(name,hex,alpha=1){
  const m=new BABYLON.StandardMaterial(name,scene);
  m.diffuseColor=BABYLON.Color3.FromHexString(hex);
  m.alpha=alpha;
  if(alpha<1){m.transparencyMode=BABYLON.Material.MATERIAL_ALPHABLEND;}
  return m;
}

const mats={
 grass:mat('grass','#6fbe55'),
 stone:mat('stone','#8b9097'),
 white:mat('white','#eceae4'),
 glass:mat('glass','#8fdcf0',.38),
 wood:mat('wood','#b78752'),
 dark:mat('dark','#3d4349'),
 leaf:mat('leaf','#4b9b55'),
 water:mat('water','#35bde0',.7),
 pink:mat('pink','#e46aaa'),
 purple:mat('purple','#8b5bd2'),
 blue:mat('blue','#477ee7'),
 cyan:mat('cyan','#3dc4dc'),
 green:mat('green','#42b96f'),
 yellow:mat('yellow','#e2bd42'),
 orange:mat('orange','#dd8434'),
 red:mat('red','#cc4c43'),
 black:mat('black','#222831')
};

const palette=[
 ['grass','🟩','Herbe'],['stone','🪨','Pierre'],['white','⬜','Béton blanc'],
 ['glass','🪟','Verre'],['wood','🟫','Bois clair'],['dark','⬛','Béton foncé'],
 ['leaf','🌿','Feuilles'],['water','🟦','Eau'],['pink','🩷','Rose'],
 ['purple','💜','Violet'],['blue','🔵','Bleu'],['cyan','🩵','Cyan'],
 ['green','💚','Vert'],['yellow','💛','Jaune'],['orange','🧡','Orange'],
 ['red','❤️','Rouge'],['black','⚫','Noir']
];
let selected='white';

function cube(name,x,y,z,material,coll=true,meta='world'){
  const b=BABYLON.MeshBuilder.CreateBox(name,{size:1},scene);
  b.position.set(x,y,z);
  b.material=material;
  b.checkCollisions=coll;
  b.isPickable=true;
  b.metadata={kind:meta,material};
  return b;
}

// Minecraft-like flat world chunks
const CH=20, chunks=new Map();
function makeGroundChunk(cx,cz){
  const key=cx+','+cz;
  if(chunks.has(key)) return;
  const g=BABYLON.MeshBuilder.CreateBox('ground',{width:CH,height:1,depth:CH},scene);
  g.position.set(cx*CH,-.5,cz*CH);
  g.material=mats.grass;
  g.checkCollisions=true;
  g.isPickable=true;
  g.metadata={kind:'ground'};
  chunks.set(key,g);
}
function streamGround(){
  const cx=Math.round(camera.position.x/CH), cz=Math.round(camera.position.z/CH);
  for(let x=cx-4;x<=cx+4;x++) for(let z=cz-4;z<=cz+4;z++) makeGroundChunk(x,z);
  for(const [k,m] of [...chunks]){
    const [x,z]=k.split(',').map(Number);
    if(Math.abs(x-cx)>5||Math.abs(z-cz)>5){m.dispose();chunks.delete(k);}
  }
}
streamGround();

// A few distant trees only, leaving a large blank build zone.
function tree(x,z){
  const trunk=cube('tree',x,1.5,z,mats.wood,true,'decor');
  trunk.scaling=new BABYLON.Vector3(.8,3,.8);
  const crown=BABYLON.MeshBuilder.CreateSphere('tree',{diameter:3.2,segments:8},scene);
  crown.position.set(x,4,z); crown.material=mats.leaf; crown.checkCollisions=true; crown.isPickable=false;
}
[-18,18,26,-26].forEach((x,i)=>tree(x,20+(i%2)*9));
[-30,30].forEach(x=>tree(x,-24));

// Saved player-built blocks
let placed=[];
function addPlaced(x,y,z,key,save=true){
  const b=cube('block',x,y,z,mats[key]||mats.white,true,'placed');
  b.metadata.key=key;
  placed.push(b);
  if(save) saveWorld();
  return b;
}
function saveWorld(){
  try{
    const data=placed.filter(b=>!b.isDisposed()).map(b=>({x:b.position.x,y:b.position.y,z:b.position.z,k:b.metadata.key||'white'}));
    localStorage.setItem('annaCityV1000World',JSON.stringify(data));
    localStorage.setItem('annaCityV1000Cam',JSON.stringify({x:camera.position.x,y:camera.position.y,z:camera.position.z,ry:camera.rotation.y}));
  }catch(e){}
}
function loadWorld(){
  try{
    const a=JSON.parse(localStorage.getItem('annaCityV1000World')||'[]');
    a.forEach(o=>addPlaced(o.x,o.y,o.z,o.k,false));
    const c=JSON.parse(localStorage.getItem('annaCityV1000Cam')||'null');
    if(c){camera.position.set(c.x,c.y,c.z);camera.rotation.y=c.ry||0;}
  }catch(e){}
}
loadWorld();

function toast(t){
  const el=document.getElementById('toast');
  el.textContent=t; el.style.opacity=1;
  clearTimeout(toast.t); toast.t=setTimeout(()=>el.style.opacity=0,1100);
}

function pick(){
  return scene.pickWithRay(camera.getForwardRay(9),m=>m.isPickable!==false);
}
function placeBlock(){
  const p=pick();
  if(!p.hit) return;
  const normal=p.getNormal(true)||BABYLON.Axis.Y;
  const q=p.pickedPoint.add(normal.scale(.55));
  const x=Math.round(q.x), y=Math.max(.5,Math.round(q.y-.5)+.5), z=Math.round(q.z);
  if(BABYLON.Vector3.Distance(new BABYLON.Vector3(x,y,z),camera.position)<1.2){toast('Trop près de toi');return;}
  addPlaced(x,y,z,selected,true);
}
function breakBlock(){
  const p=pick();
  if(p.hit&&p.pickedMesh.metadata?.kind==='placed'){
    const m=p.pickedMesh;
    placed=placed.filter(x=>x!==m);
    m.dispose();saveWorld();
  }
}

document.getElementById('placeBtn').onclick=placeBlock;
document.getElementById('breakBtn').onclick=breakBlock;
document.getElementById('jumpBtn').onclick=()=>camera.cameraDirection.y+=.18;
document.getElementById('saveBtn').onclick=()=>{saveWorld();toast('Ville sauvegardée 💾');};

// Hotbar + inventory
const hotbar=document.getElementById('hotbar'), invGrid=document.getElementById('invGrid');
palette.slice(0,9).forEach(([key,emoji,label],i)=>{
  const b=document.createElement('button'); b.className='slot'+(i===2?' sel':''); b.textContent=emoji; b.title=label;
  b.onclick=()=>{selected=key;document.querySelectorAll('.slot').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');toast(label);}
  hotbar.appendChild(b);
});
palette.forEach(([key,emoji,label])=>{
  const b=document.createElement('button'); b.className='invItem'; b.innerHTML='<b>'+emoji+'</b>'+label;
  b.onclick=()=>{selected=key;document.getElementById('inventory').style.display='none';toast(label+' sélectionné');};
  invGrid.appendChild(b);
});
document.getElementById('invBtn').onclick=()=>document.getElementById('inventory').style.display='block';
document.getElementById('invClose').onclick=()=>document.getElementById('inventory').style.display='none';

// Full-screen iPad controls
let moveTouch=null, lookTouch=null, pinch=null, moveX=0, moveY=0;
function uiTarget(el){return el&&el.closest&&el.closest('button,input,#chat,#inventory,#hotbar,#leftmenu,#righttools,#topbar');}

canvas.addEventListener('touchstart',e=>{
  if(uiTarget(e.target)) return;
  e.preventDefault();

  if(e.touches.length>=2){
    const a=e.touches[0],b=e.touches[1];
    pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2};
  }

  for(const t of e.changedTouches){
    if(t.clientX<innerWidth*.52 && !moveTouch){
      moveTouch={id:t.identifier,x0:t.clientX,y0:t.clientY,x:t.clientX,y:t.clientY};
    }else if(!lookTouch){
      lookTouch={id:t.identifier,x:t.clientX,y:t.clientY};
    }
  }
},{passive:false});

canvas.addEventListener('touchmove',e=>{
  if(uiTarget(e.target)) return;
  e.preventDefault();

  if(e.touches.length>=2){
    const a=e.touches[0],b=e.touches[1];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    const x=(a.clientX+b.clientX)/2,y=(a.clientY+b.clientY)/2;
    if(pinch){
      camera.fov=Math.max(.48,Math.min(1.25,camera.fov*(pinch.d/d)));
    }
    pinch={d,x,y};
  }

  for(const t of e.changedTouches){
    if(moveTouch&&t.identifier===moveTouch.id){
      moveTouch.x=t.clientX;moveTouch.y=t.clientY;
      moveX=Math.max(-1,Math.min(1,(moveTouch.x-moveTouch.x0)/70));
      moveY=Math.max(-1,Math.min(1,(moveTouch.y-moveTouch.y0)/70));
    }
    if(lookTouch&&t.identifier===lookTouch.id){
      const dx=t.clientX-lookTouch.x,dy=t.clientY-lookTouch.y;
      camera.rotation.y+=dx*.0045;
      camera.rotation.x=Math.max(-1.18,Math.min(1.18,camera.rotation.x+dy*.0032));
      lookTouch.x=t.clientX;lookTouch.y=t.clientY;
    }
  }
},{passive:false});

function release(t){
  if(moveTouch&&t.identifier===moveTouch.id){moveTouch=null;moveX=0;moveY=0;}
  if(lookTouch&&t.identifier===lookTouch.id){lookTouch=null;}
}
canvas.addEventListener('touchend',e=>{for(const t of e.changedTouches)release(t);if(e.touches.length<2)pinch=null;},{passive:false});
canvas.addEventListener('touchcancel',e=>{for(const t of e.changedTouches)release(t);pinch=null;},{passive:false});

// Chat Talcado
const chat=document.getElementById('chat'),msgs=document.getElementById('msgs'),input=document.getElementById('chatInput');
function addMsg(who,text){
  const d=document.createElement('div');d.className='msg '+(who==='Anna'?'me':'tal');
  d.innerHTML='<b>'+who+'</b><br>'+text;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
}
async function wiki(q){
  try{
    const s=await fetch('https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(q)+'&utf8=1&format=json&origin=*');
    const j=await s.json();const title=j?.query?.search?.[0]?.title;if(!title)return null;
    const r=await fetch('https://fr.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title));
    const x=await r.json();return x.extract?x.extract.split('. ').slice(0,2).join('. ')+'.':null;
  }catch(e){return null;}
}
async function talcado(q){
  const t=q.toLowerCase().trim();
  if(/salut|bonjour|coucou/.test(t))return 'Coucou Anna ❤️ Je suis là !';
  if(/où.*centre|ou.*centre/.test(t))return 'Comme tu construis toi-même la ville, le centre est exactement où TU décides de le créer 😎';
  if(/comment.*construire/.test(t))return 'Choisis un bloc en bas, vise avec le + puis appuie sur 🧱. Pour enlever un bloc, vise-le puis appuie sur ⛏️.';
  if(/heure/.test(t))return 'Il est '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+' ⏰';
  const ex=t.match(/(-?\d+(?:[.,]\d+)?)\s*([+\-*x×\/])\s*(-?\d+(?:[.,]\d+)?)/);
  if(ex){
    const a=parseFloat(ex[1].replace(',','.')),b=parseFloat(ex[3].replace(',','.')),op=ex[2];
    const r=op==='+'?a+b:op==='-'?a-b:(op==='*'||op==='x'||op==='×')?a*b:b? a/b:'impossible';
    return 'Ça fait '+r+' 🧮';
  }
  const w=await wiki(q);
  return w||'Je n’ai pas trouvé. Essaie de me poser la question autrement 😊';
}
async function send(){
  const q=input.value.trim();if(!q)return;
  input.value='';addMsg('Anna',q);addMsg('Talcado','Je cherche…');
  const pending=msgs.lastChild;
  const a=await talcado(q);
  pending.innerHTML='<b>Talcado</b><br>'+a;
}
document.getElementById('chatBtn').onclick=()=>chat.style.display='block';
document.getElementById('chatClose').onclick=()=>chat.style.display='none';
document.getElementById('sendBtn').onclick=send;
input.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
addMsg('Talcado','Coucou Anna ❤️ Ici, c’est TOI qui construis toute la ville !');

// Render
scene.onBeforeRenderObservable.add(()=>{
  streamGround();
  if(moveTouch){
    let f=camera.getDirection(BABYLON.Axis.Z);f.y=0;if(f.lengthSquared())f.normalize();
    let r=camera.getDirection(BABYLON.Axis.X);r.y=0;if(r.lengthSquared())r.normalize();
    camera.cameraDirection.addInPlace(f.scale(-moveY*.078));
    camera.cameraDirection.addInPlace(r.scale(moveX*.07));
  }
});
engine.runRenderLoop(()=>scene.render());
window.addEventListener('resize',()=>engine.resize());
setInterval(saveWorld,7000);
})();
</script>
</body>
</html>

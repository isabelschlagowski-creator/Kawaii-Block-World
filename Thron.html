/* === V1000 iPad full-screen controls ===
   One finger on the play area: drag up/down to move, left/right to turn.
   Two fingers: pinch to zoom + drag to look around.
*/
let v1000Touch = {one:null, two:null, move:0, turn:0};
function uiTarget(el){
  return el && (el.closest && el.closest("button,input,.panel,.chat,.joy,.actions,.btns"));
}
C.addEventListener("touchstart", e=>{
  if(uiTarget(e.target)) return;
  if(e.touches.length===1){
    const t=e.touches[0];
    v1000Touch.one={x:t.clientX,y:t.clientY};
    v1000Touch.move=0; v1000Touch.turn=0;
  } else if(e.touches.length>=2){
    const a=e.touches[0],b=e.touches[1];
    v1000Touch.two={
      d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),
      x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2
    };
    v1000Touch.one=null;
  }
},{passive:false});
C.addEventListener("touchmove", e=>{
  if(uiTarget(e.target)) return;
  e.preventDefault();
  if(e.touches.length===1 && v1000Touch.one){
    const t=e.touches[0], dx=t.clientX-v1000Touch.one.x, dy=t.clientY-v1000Touch.one.y;
    v1000Touch.turn=Math.max(-1,Math.min(1,dx/70));
    v1000Touch.move=Math.max(-1,Math.min(1,-dy/70));
  } else if(e.touches.length>=2){
    const a=e.touches[0],b=e.touches[1];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    const x=(a.clientX+b.clientX)/2,y=(a.clientY+b.clientY)/2;
    if(v1000Touch.two){
      const ratio=d/(v1000Touch.two.d||d);
      cam.fov=Math.max(.45,Math.min(1.35,cam.fov/ratio));
      cam.rotation.y+=(x-v1000Touch.two.x)*.004;
      cam.rotation.x+=(y-v1000Touch.two.y)*.003;
      cam.rotation.x=Math.max(-1.25,Math.min(1.25,cam.rotation.x));
    }
    v1000Touch.two={d,x,y};
  }
},{passive:false});
C.addEventListener("touchend", e=>{
  if(e.touches.length===0){
    v1000Touch.one=null; v1000Touch.two=null;
    v1000Touch.move=0; v1000Touch.turn=0;
  } else if(e.touches.length===1){
    const t=e.touches[0];
    v1000Touch.one={x:t.clientX,y:t.clientY};
    v1000Touch.two=null;
  }
},{passive:false});

S.onBeforeRenderObservable.add(()=>{
  if(v1000Touch.turn) cam.rotation.y += v1000Touch.turn*.045;
  if(v1000Touch.move){
    let ff=cam.getDirection(BABYLON.Axis.Z); ff.y=0;
    if(ff.lengthSquared()>0){ff.normalize(); cam.cameraDirection.addInPlace(ff.scale(v1000Touch.move*.09));}
  }
});

</script>

const pois=[['🏡','Villa d’Anna','0, -24'],['🛍️','Mall','-68, -13'],['🎡','Grande roue','63, 29'],['🕹️','Arcade','70, -18'],['🏖️','Plage','0, -125'],['🚨','Phare','-62, -130']];pois.forEach(p=>{const d=document.createElement('div');d.className='poi';d.innerHTML=`${p[0]} ${p[1]}<br><small>${p[2]}</small>`;$('poi').appendChild(d)});
function pick(){return scene.pickWithRay(camera.getForwardRay(15),m=>m.isPickable!==false)}
$('placeBtn').onclick=()=>{const p=pick();if(!p.hit){showToast('Vise le sol ou un objet');return}const n=p.getNormal(true)||BABYLON.Axis.Y,q=p.pickedPoint.add(n.scale(.7));const x=Math.round(q.x),y=Math.max(.55,Math.round(q.y*2)/2),z=Math.round(q.z);if(selected[3]==='car')car(x,z,selected[2],camera.rotation.y);else if(selected[3]==='tree')tree(x,z,.8);else if(selected[3]==='sofa'){box('placed',x,y,z,3,1,1.3,selected[2]);box('placed',x,y+1,z-.55,3,1,.3,selected[2])}else if(selected[3]==='chair'){box('placed',x,y,z,1,1,1,M.wood);box('placed',x,y+1,z-.4,1,1,.2,M.wood)}else if(selected[3]==='lamp'){cyl('placed',x,y+1,z,.25,2,M.dark);const s=BABYLON.MeshBuilder.CreateSphere('placed',{diameter:1},scene);s.position.set(x,y+2.1,z);s.material=M.yellow;s.metadata={kind:'placed'};}else box('placed',x,y,z,1,1,1,selected[2]);showToast('Objet posé ✨')};
$('breakBtn').onclick=()=>{const p=pick();if(p.hit&&['placed','car'].includes(p.pickedMesh.metadata?.kind)){p.pickedMesh.dispose();showToast('Objet retiré')}else showToast('Vise un objet que tu as posé')};
$('jumpBtn').onclick=()=>camera.cameraDirection.y+=.24;
$('bagBtn').onclick=()=>$('bag').style.display='block';$('bagClose').onclick=()=>$('bag').style.display='none';$('mapBtn').onclick=()=>$('map').style.display='block';$('mapClose').onclick=()=>$('map').style.display='none';$('chatBtn').onclick=()=>{ $('chat').style.display='block'; setTimeout(()=>$('chatInput').focus(),80)};$('chatClose').onclick=()=>$('chat').style.display='none';
function showToast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1300)}
// Touch movement and camera
let jx=0,jy=0;function joyMove(e){e.preventDefault();const t=e.touches[0],r=$('joy').getBoundingClientRect(),x0=t.clientX-r.left-r.width/2,y0=t.clientY-r.top-r.height/2,max=r.width*.31,d=Math.hypot(x0,y0)||1,s=Math.min(1,max/d),x=x0*s,y=y0*s;jx=x/max;jy=y/max;$('nub').style.transform=`translate(${x}px,${y}px)`}$('joy').addEventListener('touchstart',joyMove,{passive:false});$('joy').addEventListener('touchmove',joyMove,{passive:false});$('joy').addEventListener('touchend',()=>{jx=jy=0;$('nub').style.transform=''}, {passive:true});let look=null;canvas.addEventListener('touchstart',e=>{const t=e.touches[e.touches.length-1];if(t.clientX>innerWidth*.28)look={x:t.clientX,y:t.clientY}},{passive:true});canvas.addEventListener('touchmove',e=>{if(!look)return;const t=e.touches[e.touches.length-1];camera.rotation.y+=(t.clientX-look.x)*.004;camera.rotation.x=Math.max(-1.1,Math.min(1.1,camera.rotation.x+(t.clientY-look.y)*.004));look={x:t.clientX,y:t.clientY}},{passive:true});canvas.addEventListener('touchend',()=>look=null,{passive:true});
// Chat/Talcado
function addMsg(who,text,cls){const d=document.createElement('div');d.className='bubble '+cls;d.innerHTML=`<b>${who}</b><br>${escapeHtml(text)}`;$('msgs').appendChild(d);$('msgs').scrollTop=$('msgs').scrollHeight;return d}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function localAnswer(q){const t=q.toLowerCase().trim();if(!t)return 'Écris-moi une question 😊';if(/bonjour|salut|coucou|hello/.test(t))return 'Coucou Anna ❤️ Je suis là ! Pose-moi une question ou demande-moi où aller dans la ville.';if(/comment tu t['’]?appelles|ton nom/.test(t))return 'Je m’appelle Talcado 😎 et je vis dans Anna City avec toi.';if(/où.*(mall|centre commercial)/.test(t))return 'Le Mall est à gauche de la villa, vers les coordonnées -68, -13. 🛍️';if(/où.*(plage|mer)/.test(t))return 'La plage est loin derrière la villa, vers z = -125. Le phare est à gauche de la plage. 🏖️';if(/où.*grande roue|fête foraine/.test(t))return 'La grande roue est à droite de la ville, vers 63, 29. 🎡';if(/où.*villa|maison/.test(t))return 'La grande villa blanche et colorée est au centre, vers 0, -24. 🏡';if(/quelle heure|l['’]?heure/.test(t))return 'Il est '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+' ⏰';if(/quel jour|date aujourd/.test(t))return 'Nous sommes le '+new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.';if(/combien font|calcule|calcul/.test(t)){const ex=t.replace(/,/g,'.').match(/(-?\d+(?:\.\d+)?)\s*([+\-*x×\/])\s*(-?\d+(?:\.\d+)?)/);if(ex){const a=+ex[1],b=+ex[3],op=ex[2];let r=op==='+'?a+b:op==='-'?a-b:(op==='*'||op==='x'||op==='×')?a*b:b!==0?a/b:'impossible';return 'Ça fait '+r+' 🧮';}}
if(/qui est|qu['’]?est ce que|c['’]?est quoi|capitale|combien de|pourquoi|comment/.test(t))return null;return 'Je t’écoute 😊 Tu peux me demander des choses sur Anna City, l’heure, des calculs, ou une question de culture générale.'}
async function wikiAnswer(q){try{const s=await fetch('https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(q)+'&utf8=1&format=json&origin=*',{cache:'no-store'});if(!s.ok)throw 0;const js=await s.json(),hit=js?.query?.search?.[0];if(!hit)return null;const r=await fetch('https://fr.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(hit.title),{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();if(!j.extract)return null;let text=j.extract.replace(/\s+/g,' ').trim();if(text.length>520)text=text.slice(0,517).replace(/\s+\S*$/,'')+'…';return text+'\n\n📚 Source : Wikipédia';}catch(e){return null}}
async function askTalcado(q){const local=localAnswer(q);if(local!==null)return local;const wiki=await wikiAnswer(q);if(wiki)return wiki;return 'Je n’ai pas réussi à trouver une réponse fiable à cette question. Essaie de la poser avec des mots un peu plus précis 😊';}
async function send(){const input=$('chatInput'),q=input.value.trim();if(!q)return;addMsg('Anna',q,'me');input.value='';const typing=addMsg('Talcado','Je cherche…','tal typing');const ans=await askTalcado(q);typing.remove();addMsg('Talcado',ans,'tal')}
$('sendBtn').onclick=send;$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')send()});addMsg('Talcado','Coucou Anna ❤️ Bienvenue dans Anna City V1000 ! Maintenant je peux répondre à beaucoup de questions, et pour les questions de culture générale j’essaie de chercher une réponse sur Wikipédia.','tal');
// Render loop
let last=performance.now();scene.onBeforeRenderObservable.add(()=>{const now=performance.now(),dt=Math.min(40,now-last);last=now;streamGround();for(const p of people){const t=p.metadata.t,dx=t.x-p.position.x,dz=t.z-p.position.z,d=Math.hypot(dx,dz);if(d<1){newTarget(p);continue}const s=p.metadata.speed*dt;p.position.x+=dx/d*s;p.position.z+=dz/d*s;p.rotation.y=Math.atan2(dx,dz);p.metadata.phase+=dt*.012;const a=Math.sin(p.metadata.phase)*.55;p.metadata.la.rotation.x=a;p.metadata.ra.rotation.x=-a;p.metadata.ll.rotation.x=-a;p.metadata.rl.rotation.x=a}const f=camera.getDirection(BABYLON.Axis.Z);f.y=0;f.normalize();const r=camera.getDirection(BABYLON.Axis.X);r.y=0;r.normalize();camera.cameraDirection.addInPlace(f.scale(-jy*.075));camera.cameraDirection.addInPlace(r.scale(jx*.075));});
engine.runRenderLoop(()=>scene.render());window.addEventListener('resize',()=>engine.resize());
})();

/* === V1000 iPad full-screen controls ===
   One finger on the play area: drag up/down to move, left/right to turn.
   Two fingers: pinch to zoom + drag to look around.
*/
let v1000Touch = {one:null, two:null, move:0, turn:0};
function uiTarget(el){
  return el && (el.closest && el.closest("button,input,.panel,.chat,.joy,.actions,.btns"));
}
C.addEventListener("touchstart", e=>{
  if(uiTarget(e.target)) return;
  if(e.touches.length===1){
    const t=e.touches[0];
    v1000Touch.one={x:t.clientX,y:t.clientY};
    v1000Touch.move=0; v1000Touch.turn=0;
  } else if(e.touches.length>=2){
    const a=e.touches[0],b=e.touches[1];
    v1000Touch.two={
      d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),
      x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2
    };
    v1000Touch.one=null;
  }
},{passive:false});
C.addEventListener("touchmove", e=>{
  if(uiTarget(e.target)) return;
  e.preventDefault();
  if(e.touches.length===1 && v1000Touch.one){
    const t=e.touches[0], dx=t.clientX-v1000Touch.one.x, dy=t.clientY-v1000Touch.one.y;
    v1000Touch.turn=Math.max(-1,Math.min(1,dx/70));
    v1000Touch.move=Math.max(-1,Math.min(1,-dy/70));
  } else if(e.touches.length>=2){
    const a=e.touches[0],b=e.touches[1];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    const x=(a.clientX+b.clientX)/2,y=(a.clientY+b.clientY)/2;
    if(v1000Touch.two){
      const ratio=d/(v1000Touch.two.d||d);
      cam.fov=Math.max(.45,Math.min(1.35,cam.fov/ratio));
      cam.rotation.y+=(x-v1000Touch.two.x)*.004;
      cam.rotation.x+=(y-v1000Touch.two.y)*.003;
      cam.rotation.x=Math.max(-1.25,Math.min(1.25,cam.rotation.x));
    }
    v1000Touch.two={d,x,y};
  }
},{passive:false});
C.addEventListener("touchend", e=>{
  if(e.touches.length===0){
    v1000Touch.one=null; v1000Touch.two=null;
    v1000Touch.move=0; v1000Touch.turn=0;
  } else if(e.touches.length===1){
    const t=e.touches[0];
    v1000Touch.one={x:t.clientX,y:t.clientY};
    v1000Touch.two=null;
  }
},{passive:false});

S.onBeforeRenderObservable.add(()=>{
  if(v1000Touch.turn) cam.rotation.y += v1000Touch.turn*.045;
  if(v1000Touch.move){
    let ff=cam.getDirection(BABYLON.Axis.Z); ff.y=0;
    if(ff.lengthSquared()>0){ff.normalize(); cam.cameraDirection.addInPlace(ff.scale(v1000Touch.move*.09));}
  }
});
